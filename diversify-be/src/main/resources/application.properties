# Nome dell'applicazione
spring.application.name=diversify-be

# Credenziali login backend
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin123}

# Configurazione MongoDB
spring.data.mongodb.database=${MONGODB_DATABASE:diversifydb}
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}

# Configurazione JWT
jwt.secret=${JWT_SECRET:your_secret_key}
jwt.expiration-time=${JWT_EXPIRATION_TIME:3600}

# Porta di ascolto
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0
